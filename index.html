<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OT Submarina Chiloé</title>
<meta name="theme-color" content="#0f161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OT Submarina">
<style>html,body{margin:0;height:100%;background:#0f161c;color:#e6ecf0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#l{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;text-align:center;padding:0 24px;box-sizing:border-box}#l img{width:88px;height:88px;border-radius:20px}#l p{margin:0;color:#94a3ae}</style>
</head>
<body>
<div id="l"><img src="icon-192.png" alt=""><p id="lt">Cargando orden de trabajo…</p></div>
<script>
// Carga siempre la última versión de la app desde el servidor del taller (Google Apps Script)
// y la adapta para funcionar aquí, sin pasar por páginas de Google.
(async function(){
  var API="https://script.google.com/macros/s/AKfycbyk2ytSA7EyLSE5D8AbEJpoCJmSyn8KZvieVPRQsCVlk6PTExo-ZoX8wQs7yCLYVHvL/exec";
  var CACHE="ot-app-src";
  var s=null;
  try{var r=await fetch(API+"?src=1&t="+Date.now(),{credentials:"omit",cache:"no-store"});if(r.ok){s=await r.text();try{localStorage.setItem(CACHE,s)}catch(e){}}}catch(e){}
  if(!s){try{s=localStorage.getItem(CACHE)}catch(e){}}
  if(!s||s.indexOf("callServer")<0){document.getElementById("lt").textContent="No se pudo cargar la app. Revisa tu conexión a internet y vuelve a abrirla.";return}
  var head='<meta name="theme-color" content="#0f161c">\n<link rel="manifest" href="manifest.webmanifest">\n<link rel="icon" type="image/png" href="favicon.png">\n<link rel="apple-touch-icon" href="apple-touch-icon.png">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="OT Submarina">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">';
  var call='function callServer(d){return fetch(API,{method:"POST",body:JSON.stringify(d),credentials:"omit",redirect:"follow"}).then(function(x){if(!x.ok)throw new Error("el servidor respondió "+x.status);return x.json()}).then(function(r){if(!r||!r.ok)throw new Error((r&&r.error)||"error del servidor");return r})}';
  var inst='<button id="install" type="button" hidden style="position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:20;background:#1f9d55;color:#fff;border:0;border-radius:999px;padding:9px 16px;font:600 14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer">Instalar app</button>\n<script>\nif("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});\nvar deferredInstall=null,instBtn=document.getElementById("install");\nwindow.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredInstall=e;instBtn.hidden=false});\ninstBtn.onclick=function(){if(!deferredInstall)return;instBtn.hidden=true;deferredInstall.prompt();deferredInstall=null};\nwindow.addEventListener("appinstalled",function(){instBtn.hidden=true});\n<\/script>\n</body>';
  s=s.replace("<title>Orden de Trabajo</title>","<title>OT Submarina Chiloé</title>")
     .replace(/<meta name="theme-color"[^>]*>/,head)
     .replace(/function callServer\(d\)\{[^\n]*/,call)
     .replace("const $ = id =>",'const API="'+API+'";\nconst $ = id =>')
     .replace("</body>",inst);
  document.open();document.write(s);document.close();
})();
</script>
</body>
</html>
